<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic spatial</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body{margin:0;background:#f4f7fb;color:#13213a;font-family:Arial,sans-serif}.diagnostic-page{max-width:1050px;margin:auto;padding:32px}.diagnostic-card{background:#fff;border:1px solid #dbe5f2;border-radius:24px;padding:28px;margin-top:22px}.status{display:inline-block;padding:9px 14px;border-radius:999px;font-weight:800;background:#e8eef9}.status.direct_geo{background:#dcfce7;color:#166534}.status.join_required{background:#fef3c7;color:#92400e}.status.geocoding_possible{background:#dbeafe;color:#1e40af}.status.not_spatial{background:#fee2e2;color:#991b1b}.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.info{border:1px solid #dbe5f2;border-radius:16px;padding:16px}.key-card{border:1px solid #f1d29c;background:#fffbeb;border-radius:16px;padding:16px;margin:12px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.action-link{display:inline-block;padding:12px 18px;border-radius:14px;background:#123a7a;color:#fff;text-decoration:none;font-weight:800}.secondary{background:#eef3fb;color:#123a7a}.error{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.muted{color:#60708b}.examples{font-family:monospace;font-size:.9rem;overflow-wrap:anywhere}.candidate-section{margin-top:26px}.candidate-list{display:grid;gap:16px}.candidate-card{border:1px solid #cbd8ea;border-radius:18px;padding:18px;background:#f8fbff}.candidate-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.candidate-heading h4{margin:0 0 4px}.confidence{display:inline-block;padding:7px 10px;border-radius:999px;font-weight:800;background:#e8eef9;white-space:nowrap}.confidence.élevée{background:#dcfce7;color:#166534}.confidence.moyenne{background:#fef3c7;color:#92400e}.confidence.faible{background:#fee2e2;color:#991b1b}.candidate-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}.candidate-details div{border:1px solid #dbe5f2;border-radius:12px;padding:10px;background:#fff}.candidate-details dt{font-weight:800}.candidate-details dd{margin:6px 0 0}.candidate-warning{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:12px}.candidate-actions{margin-top:14px}.candidate-selected{border:3px solid #2563eb;background:#f3f7ff}.best-badge{display:inline-block;margin-bottom:10px;padding:7px 11px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:800}.candidate-note{margin:14px 0 0;color:#64748b;font-size:.92rem}.candidate-selectable{cursor:pointer;transition:border-color .15s,transform .1s}.candidate-selectable:hover{border-color:#93b4e6}.candidate-selectable:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.candidate-disabled{opacity:.75}
  </style>
</head>
<body>
  <main class="diagnostic-page">
    <a href="/" class="action-link secondary">← Retour au catalogue</a>
    <h1>Diagnostic spatial du dataset</h1>
    <p class="muted">{{ dataset_title }}</p>
    <section id="diagnosticCard" class="diagnostic-card">
      <p id="loading">Analyse d’un échantillon des enregistrements en cours…</p>
    </section>
  </main>
  <script>window.SPATIAL_DATASET_ID={{ dataset_id|tojson }}; window.SPATIAL_DATASET_TITLE={{ dataset_title|tojson }};</script>
  <script src="{{ url_for('static', filename='js/diagnostic_spatial.js') }}?v=4"></script>
</body>
</html>
